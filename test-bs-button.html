<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test BS Button</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .bs-btn {
            padding: 1rem;
            margin: 0.5rem;
            border: 2px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 8px;
        }
        .bs-btn.selected {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 1rem;
            text-align: left;
        }
        th {
            background: #f0f0f0;
        }
        #result {
            margin-top: 2rem;
            padding: 1rem;
            background: #e3f2fd;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Tombol Benar/Salah</h1>
    <p>Klik tombol Benar/Salah untuk setiap pernyataan, lalu klik "Cek Jawaban"</p>

    <table class="tabel-soal bs-table">
        <thead>
            <tr>
                <th>Pernyataan</th>
                <th>Benar</th>
                <th>Salah</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Indonesia adalah negara kepulauan</td>
                <td><button type="button" class="bs-btn" data-statement="A" data-value="B">Benar</button></td>
                <td><button type="button" class="bs-btn" data-statement="A" data-value="S">Salah</button></td>
            </tr>
            <tr>
                <td>Jakarta adalah ibu kota Jawa Barat</td>
                <td><button type="button" class="bs-btn" data-statement="B" data-value="B">Benar</button></td>
                <td><button type="button" class="bs-btn" data-statement="B" data-value="S">Salah</button></td>
            </tr>
            <tr>
                <td>Pancasila memiliki 5 sila</td>
                <td><button type="button" class="bs-btn" data-statement="C" data-value="B">Benar</button></td>
                <td><button type="button" class="bs-btn" data-statement="C" data-value="S">Salah</button></td>
            </tr>
        </tbody>
    </table>

    <button type="button" id="btnCekBS" style="padding: 1rem 2rem; background: #2196f3; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem;">
        ✅ Cek Jawaban
    </button>

    <div id="result"></div>
    <div id="log" style="margin-top: 2rem; padding: 1rem; background: #f5f5f5; border-radius: 8px; font-family: monospace; font-size: 0.9rem;"></div>

    <script>
        const answers = {};
        const logDiv = document.getElementById('log');
        
        function log(message) {
            console.log(message);
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
        }

        log('Script loaded');
        
        const bsBtns = document.querySelectorAll('.bs-btn');
        log(`Found ${bsBtns.length} BS buttons`);
        
        bsBtns.forEach((btn, index) => {
            log(`Attaching onclick to button ${index + 1}`);
            btn.onclick = () => {
                const statement = btn.getAttribute('data-statement');
                const value = btn.getAttribute('data-value');
                answers[statement] = value;
                
                log(`Clicked: Statement ${statement}, Value ${value}`);
                
                // Remove selected from other buttons in the same row
                document.querySelectorAll(`.bs-btn[data-statement="${statement}"]`).forEach(item => {
                    item.classList.remove('selected');
                });
                
                // Add selected to clicked button
                btn.classList.add('selected');
                
                log(`Current answers: ${JSON.stringify(answers)}`);
            };
        });
        
        const btnCek = document.getElementById('btnCekBS');
        if (btnCek) {
            log('btnCekBS found');
            btnCek.onclick = () => {
                log('Cek Jawaban clicked');
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>Hasil Jawaban Kamu:</h3>
                    <ul>
                        ${Object.entries(answers).map(([key, val]) => `<li>Pernyataan ${key}: ${val === 'B' ? '✅ Benar' : '❌ Salah'}</li>`).join('')}
                    </ul>
                    <p><strong>Kunci Jawaban yang Benar: B, S, B</strong></p>
                    <p>Jawaban kamu: ${JSON.stringify(answers)}</p>
                `;
            };
        } else {
            log('ERROR: btnCekBS NOT FOUND');
        }
    </script>
</body>
</html>
